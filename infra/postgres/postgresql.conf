# ─── Connection ─────────────────────────────────────────────────────────────
listen_addresses = '*'
max_connections = 200

# ─── WAL — Critical for Debezium CDC ───────────────────────────────────────
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10
wal_keep_size = '1GB'

# ─── Performance ────────────────────────────────────────────────────────────
shared_buffers = '256MB'
work_mem = '16MB'
maintenance_work_mem = '128MB'
effective_cache_size = '512MB'

# ─── Write Performance ─────────────────────────────────────────────────────
synchronous_commit = off
checkpoint_completion_target = 0.9
wal_buffers = '16MB'
max_wal_size = '2GB'

# ─── Logging ────────────────────────────────────────────────────────────────
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: user=%u,db=%d '
log_statement = 'none'
